services:
  - type: web
    name: chess-v2-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CHESS_V2_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: STOCKFISH_PATH
        sync: false
